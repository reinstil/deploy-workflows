# Prüft jeden Pull Request und jeden Stand von main: Workflow-Syntax (actionlint mit shellcheck),
# Test-Skripte (shellcheck) und die Sicherungen in deploy-static.yml (Zielpfad, rsync-Regeln).
# Läuft ohne Secrets und nur mit Leserechten, auch für Pull Requests aus Forks.

name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          # Download-Skript auf den Commit von v1.7.12 festgelegt
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: shellcheck
        run: shellcheck --version && shellcheck tests/*.sh

      - name: Zielpfad und rsync-Regeln testen
        run: bash tests/deploy-static-testen.sh
